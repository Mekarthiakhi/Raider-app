name: Build Fleet Track APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Remove Outdated System Gradle
        run: sudo rm -f /usr/bin/gradle

      - name: Fix Line Endings and Permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          echo "### Gradle Build Output (Exit Code: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log
          exit $EXIT_CODE

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FleetTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish Direct Mobile Download Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "Fleet Track APK (Latest)"
          body: "Direct 1-click download for mobile phone testing without GitHub login"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
