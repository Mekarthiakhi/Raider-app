name: Build Fleet Track APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          # Download the official Gradle 8.11.1 distribution
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip

          # Extract ONLY the wrapper jar from the distribution
          mkdir -p gradle/wrapper
          unzip -j /tmp/gradle.zip "gradle-8.11.1/lib/plugins/gradle-wrapper-8.11.1.jar" -d /tmp/wrapper-extract

          # Place it where gradlew expects it
          cp /tmp/wrapper-extract/gradle-wrapper-8.11.1.jar gradle/wrapper/gradle-wrapper.jar

          # Ensure gradlew is executable
          chmod +x gradlew

          echo "✅ Wrapper JAR bootstrapped successfully"
          ls -la gradle/wrapper/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FleetTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
