# Render Infrastructure Blueprint for SVM FLEET Operating System
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. Static Site (Free Tier on Render, fast global CDN)
  - type: web
    name: svm-fleet-web
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
